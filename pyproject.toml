[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "growx-crawl"
version = "0.1.0"
description = "GrowX Crawl - High-performance lead intelligence crawler, normalization, deduplication, scoring, and extraction pipeline."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [
    { name = "GrowXLabs Team", email = "engineering@growxlabs.tech" }
]
dependencies = [
    "httpx>=0.27.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.1.0",
    "typer>=0.12.0",
    "rich>=13.7.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "pyyaml>=6.0.1",
    "openpyxl>=3.1.2",
    "python-dotenv>=1.0.1",
    "camoufox>=0.5.0",
    "brotli>=1.1.0",
    "zstandard>=0.23.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[project.scripts]
growx-crawl = "growx_crawl.cli.main:app"

[tool.hatch.build.targets.wheel]
packages = ["src/growx_crawl"]

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q"
testpaths = ["tests"]
pythonpath = ["src"]
